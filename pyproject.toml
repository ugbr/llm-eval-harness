[project]
name = "llm-eval-harness"
version = "0.1.0"
description = "Eval harness for an LLM document extraction pipeline: traces, error analysis, judges, CI gate."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Uguudei Bayar", email = "uguudei.bayar@gmail.com" }]
dependencies = [
    "anthropic>=0.120.0",
    "fastapi>=0.141.1",
    "langfuse>=4.14.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "uvicorn>=0.52.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalharness"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]
